name: Build HushGram MPP

on:
  push:
    branches:
      - arabic-translation-review
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: hushgram-mpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate localization source
        run: python scripts/gen-l10n.py
      - name: Test localization tables
        run: python scripts/test-l10n.py

  build-mpp:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate localization source
        run: python scripts/gen-l10n.py
      - name: Generate complete patch catalog
        run: .\gradlew.bat --no-daemon :patches:generatePatchesList
      - name: Build Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\gradlew.bat --no-daemon :patches:buildAndroid
      - name: Run patch tests
        # Instagram unit-test compile currently fails upstream dependency verification for Bouncy Castle 1.85.
        # Keep verification strict; do not auto-trust dependencies or alter upstream checksums.
        run: .\gradlew.bat --no-daemon :patches:test
      - name: Print failing patch test reports
        if: failure()
        shell: pwsh
        run: |
          $reports = @(Get-ChildItem -Path 'patches' -Recurse -File -Filter 'TEST-*.xml' -ErrorAction SilentlyContinue)
          if ($reports.Count -eq 0) {
            Write-Host 'No JUnit XML reports found under patches/.'
            Get-ChildItem -Path 'patches/build' -Recurse -Directory -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'test-results|reports' } |
              Select-Object -ExpandProperty FullName
          }
          foreach ($report in $reports) {
            if ($report.Name -match 'ObfuscatedIdentityTest|ReadmePatchNamesTest') {
              Write-Host "===== $($report.FullName) ====="
              Get-Content -LiteralPath $report.FullName
            }
          }
      - name: Check and hash release bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path 'patches/build/release/*.mpp' -File)
          if ($bundles.Count -eq 0) {
            throw 'No .mpp bundle was found in patches/build/release/.'
          }
          $lines = foreach ($bundle in $bundles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle.FullName).Hash.ToLowerInvariant()
            "$hash  $($bundle.Name)"
          }
          Set-Content -LiteralPath 'patches/build/release/SHA256SUMS.txt' -Value $lines -Encoding utf8NoBOM
          $bundles | Select-Object Name, Length
          Get-Content 'patches/build/release/SHA256SUMS.txt'
          Get-ChildItem -Path 'patches/build/release/*.cdx.json' -File | Select-Object Name, Length
      - name: Upload MPP bundle and release metadata
        uses: actions/upload-artifact@v4
        with:
          name: HushGram-MPP-${{ github.sha }}
          path: |
            patches/build/release/*.mpp
            patches/build/release/*.cdx.json
            patches/build/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
