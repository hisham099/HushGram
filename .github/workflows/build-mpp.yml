name: Build HushGram MPP

on:
  push:
    branches:
      - arabic-translation-review
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: hushgram-mpp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localization-tests:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate localization source
        run: python scripts/gen-l10n.py
      - name: Test localization tables
        run: python scripts/test-l10n.py

  build-mpp:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate localization source
        run: python scripts/gen-l10n.py
      - name: Build Morphe patch bundle
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\gradlew.bat --no-daemon buildAndroid
      - name: Check and hash MPP output
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path 'patches/build/libs/*.mpp' -File)
          if ($bundles.Count -eq 0) {
            throw 'Gradle completed but no .mpp bundle was found in patches/build/libs/.'
          }
          $lines = foreach ($bundle in $bundles) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $bundle.FullName).Hash.ToLowerInvariant()
            "$hash  $($bundle.Name)"
          }
          Set-Content -LiteralPath 'patches/build/libs/SHA256SUMS.txt' -Value $lines -Encoding utf8NoBOM
          $bundles | Select-Object Name, Length
          Get-Content 'patches/build/libs/SHA256SUMS.txt'
      - name: Upload MPP bundle
        uses: actions/upload-artifact@v4
        with:
          name: HushGram-MPP-${{ github.sha }}
          path: |
            patches/build/libs/*.mpp
            patches/build/libs/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
