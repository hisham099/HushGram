name: Upstream sync review

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/upstream-sync-review.yml"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  packages: read

concurrency:
  group: hushgram-upstream-sync
  cancel-in-progress: false

jobs:
  prepare-review:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out current Arabic main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch upstream and prepare a review branch
        id: sync
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/SysAdminDoc/HushGram.git
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Arabic main already contains upstream main."
            exit 0
          fi

          OPEN_SYNC_PR="$(gh pr list --base main --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("automation/upstream-sync-"))] | length')"
          if [ "$OPEN_SYNC_PR" != "0" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "An upstream-sync review PR is already open. Resolve it before creating another."
            exit 0
          fi

          SYNC_BRANCH="automation/upstream-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$SYNC_BRANCH"
          git merge --no-edit -X ours upstream/main
          python scripts/merge-upstream-l10n.py

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$SYNC_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate Arabic catalog and generated translations
        id: validation
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          set -uo pipefail
          status=passed
          if ! python scripts/gen-l10n.py; then
            status=needs-translation-or-catalog-review
          elif ! python scripts/test-l10n.py; then
            status=localization-tests-failed
          fi

          git add CHANGELOG.md extensions/shared/library/src/main/l10n/*.tsv
          if [ "$status" = "passed" ]; then
            git add extensions/shared/library/src/main/java/app/hushgram/extension/shared/L10nTranslations.java
          fi
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): reconcile upstream localization catalog"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish upstream review branch and open PR
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          VALIDATION: ${{ steps.validation.outputs.status }}
          SYNC_BRANCH: ${{ steps.sync.outputs.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git push origin "$SYNC_BRANCH"
          gh pr create --base main --head "$SYNC_BRANCH" \
            --title "chore(sync): integrate latest upstream into Arabic main" \
            --body "Automated upstream sync review. Preserves fork-side changes on conflicts, reconciles localization tables, and records catalog validation status: $VALIDATION. Review all changed files and run MPP validation before merging."
          echo "Review branch and pull request published. Localization validation: $VALIDATION"

      - name: Report review required
        if: steps.sync.outputs.changed == 'true' && steps.validation.outputs.status != 'passed'
        shell: bash
        env:
          VALIDATION: ${{ steps.validation.outputs.status }}
        run: |
          echo "::error::Upstream changes were isolated in a review PR, but validation needs attention: $VALIDATION"
          exit 1
